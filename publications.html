<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications | Rice RobotΠ Lab</title>
  <meta name="description" content="Publications from the Rice RobotΠ Lab.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-head">
      <div class="wrap">
        <h1>Publications</h1>
        <p>Papers from the lab and its members, newest first.</p>
      </div>
    </div>

    <section class="section">
      <div class="wrap">
        <div class="pub-tools">
          <input class="pub-search" id="pub-search" type="search" placeholder="Search by title, author, venue or year" aria-label="Search publications">
          <select class="pub-select" id="pub-year" aria-label="Filter by year"></select>
          <div class="chips" id="pub-chips" role="group" aria-label="Filter by venue"></div>
        </div>
        <p class="pub-count" id="pub-count" aria-live="polite"></p>
        <div id="pub-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/people.js"></script>
  <script src="data/publications.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
