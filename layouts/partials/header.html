<header class="site-header" id="site-header">
  <div class="container nav-bar">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} — home">
      {{- with resources.Get "media/icon.png" }}{{ $i := .Fit "80x80" }}
      <img src="{{ $i.RelPermalink }}" width="{{ $i.Width }}" height="{{ $i.Height }}" alt="">
      {{- end }}
      <span class="brand-text">Rice <strong>Robot<span class="pi">Π</span> Lab</strong></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      {{- $page := . }}
      {{- range site.Menus.main }}
      {{- $active := or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }}
      <li><a href="{{ .URL }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </div>
</header>
