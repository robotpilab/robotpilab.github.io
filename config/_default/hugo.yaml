# Hugo configuration for the Rice RobotΠ Lab website.
# The site uses its own lightweight theme in `layouts/` and `assets/` (no external theme or modules).
# Docs: https://gohugo.io/getting-started/configuration/

title: Rice RobotΠ Lab
baseURL: 'https://robotpilab.github.io/'

defaultContentLanguage: en
hasCJKLanguage: false
removePathAccents: true

enableRobotsTXT: true
enableEmoji: true
enableGitInfo: false
summaryLength: 30
timeout: 600000

# No tag / category / author archive pages.
disableKinds:
  - taxonomy
  - term

# Old URLs that moved (e.g. /contact/ -> /join/) get a redirect page.
disableAliases: false

outputs:
  home: [HTML]
  section: [HTML, RSS]
  page: [HTML]

pagination:
  pagerSize: 200

markup:
  goldmark:
    renderer:
      unsafe: true   # some news posts contain inline HTML
  tableOfContents:
    startLevel: 2
    endLevel: 3

imaging:
  resampleFilter: lanczos
  quality: 82
  anchor: smart

sitemap:
  changefreq: monthly
